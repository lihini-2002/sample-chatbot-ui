<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen Assistant</title>
<style>
/* Layout: chat-app shell — collapsible history sidebar on the left, centered 720px conversation column, prompt box pinned to the bottom */
:root {
  --bg: #ffffff;
  --side: #f6f6f4;
  --fg: #1d1d1b;
  --muted: #6b6b66;
  --line: #e4e4df;
  --hover: #ececE8;
  --bubble: #f1f1ee;
  --accent: #5b5bd6;
  --accent-fg: #ffffff;
  --box: #ffffff;
  --shadow: 0 2px 12px rgba(20, 20, 40, 0.08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1f1e; --side: #171716; --fg: #ececea; --muted: #9b9b96; --line: #33332f;
    --hover: #2a2a28; --bubble: #2e2e2b; --accent: #8b8bf0; --accent-fg: #14142b; --box: #2a2a28;
    --shadow: 0 2px 12px rgba(0,0,0,0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1f1e; --side: #171716; --fg: #ececea; --muted: #9b9b96; --line: #33332f;
  --hover: #2a2a28; --bubble: #2e2e2b; --accent: #8b8bf0; --accent-fg: #14142b; --box: #2a2a28;
  --shadow: 0 2px 12px rgba(0,0,0,0.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

.app { display: flex; height: 100%; }

/* Sidebar */
.side { width: 260px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 10px; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 6px 8px 12px; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.new-chat { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-weight: 500; }
.new-chat:hover, .hist:hover { background: var(--hover); }
.new-chat svg { width: 18px; height: 18px; }
.hist-label { font-size: 12px; color: var(--muted); padding: 14px 10px 4px; font-weight: 600; letter-spacing: .02em; }
.hist { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.hist.active { background: var(--hover); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--line); }
.me { width: 30px; height: 30px; border-radius: 50%; background: #2f7d6d; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.plan { font-size: 12px; color: var(--muted); }

/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid transparent; }
.menu-btn { display: none; width: 36px; height: 36px; border-radius: 8px; place-items: center; }
.menu-btn:hover { background: var(--hover); }
.model { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 16px; }
.model:hover { background: var(--hover); }
.model small { color: var(--muted); font-weight: 500; }

.scroll { flex: 1; overflow-y: auto; padding-inline: 16px; }
.col { max-width: 720px; margin: 0 auto; padding-block: 24px; display: flex; flex-direction: column; gap: 24px; }

.empty { min-height: 48vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; text-align: center; }
.empty h1 { font-size: 28px; font-weight: 600; margin: 0; text-wrap: balance; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 600px; }
.chip { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.chip:hover { background: var(--hover); }
.chip b { display: block; font-weight: 600; }
.chip span { color: var(--muted); }

.msg { display: flex; gap: 12px; }
.msg.user { justify-content: flex-end; }
.msg.user .text { background: var(--bubble); border-radius: 18px; padding: 10px 16px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot .avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex-shrink: 0; margin-top: 2px; }
.msg.bot .text { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.bot-tools { display: flex; gap: 2px; margin-top: 6px; color: var(--muted); }
.bot-tools button { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; }
.bot-tools button:hover { background: var(--hover); color: var(--fg); }
.bot-tools svg { width: 16px; height: 16px; }
.typing { display: inline-flex; gap: 4px; padding-top: 8px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* Composer */
.dock { padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.box { max-width: 720px; margin: 0 auto; background: var(--box); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 10px 10px 8px 16px; }
#prompt { width: 100%; border: 0; outline: none; resize: none; background: transparent; color: var(--fg); font: inherit; font-size: 16px; line-height: 1.5; max-height: 220px; padding: 4px 0; }
#prompt::placeholder { color: var(--muted); }
.box-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.box-tools { display: flex; gap: 2px; margin-left: -8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn svg { width: 19px; height: 19px; }
.send { width: 34px; height: 34px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.send:disabled { opacity: .3; cursor: default; }
.send svg { width: 18px; height: 18px; }
.fine { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

.scrim { display: none; }
@media (max-width: 768px) {
  .side { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
  .app.open .side { transform: none; }
  .app.open .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.35); }
  .menu-btn { display: grid; }
  .chips { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } .side { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Chat history">
    <div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg></div>Lumen</div>
    <button class="new-chat" id="new-chat" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>New chat</button>
    <div class="hist-label">Today</div>
    <button class="hist active" type="button">New conversation</button>
    <div class="hist-label">Previous 7 days</div>
    <button class="hist" type="button">Weekend meal prep ideas</button>
    <button class="hist" type="button">Explain compound interest simply</button>
    <button class="hist" type="button">Rewrite cover letter opening</button>
    <button class="hist" type="button">Tips for a first 10K run</button>
    <div class="hist-label">Previous 30 days</div>
    <button class="hist" type="button">Plan a 3-day trip to Melbourne</button>
    <button class="hist" type="button">How do heat pumps work?</button>
    <div class="side-foot"><div class="me" aria-hidden="true">Y</div><div><div>You</div><div class="plan">Free plan</div></div></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="top">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open chat history"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="model" type="button">Lumen <small>3.2</small><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>

    <div class="scroll" id="scroll">
      <div class="col" id="thread">
        <section class="empty" id="empty">
          <h1>What can I help you with?</h1>
          <div class="chips">
            <button class="chip" type="button" data-p="Help me write an email to my landlord about a broken heater"><b>Write an email</b><span>to my landlord about a broken heater</span></button>
            <button class="chip" type="button" data-p="Plan a relaxing weekend in the Blue Mountains"><b>Plan a weekend</b><span>in the Blue Mountains</span></button>
            <button class="chip" type="button" data-p="Explain how a credit score is calculated"><b>Explain</b><span>how a credit score is calculated</span></button>
            <button class="chip" type="button" data-p="Suggest a healthy dinner I can cook in 20 minutes"><b>Suggest a dinner</b><span>I can cook in 20 minutes</span></button>
          </div>
        </section>
      </div>
    </div>

    <div class="dock">
      <form class="box" id="composer" autocomplete="off">
        <textarea id="prompt" name="prompt" rows="1" placeholder="Message Lumen" aria-label="Message Lumen" spellcheck="true"></textarea>
        <div class="box-row">
          <div class="box-tools">
            <button class="icon-btn" type="button" title="Attach files" aria-label="Attach files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 11-8.6 8.6a5 5 0 01-7-7L14 4a3.3 3.3 0 014.7 4.7l-8.6 8.6a1.7 1.7 0 01-2.4-2.4L15.6 7"/></svg></button>
            <button class="icon-btn" type="button" title="Search the web" aria-label="Search the web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></svg></button>
          </div>
          <button class="send" id="send" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </form>
      <div class="fine">Lumen can make mistakes. Check important info.</div>
    </div>
  </main>
</div>

<script>
(function () {
  var ta = document.getElementById('prompt');
  var send = document.getElementById('send');
  var thread = document.getElementById('thread');
  var empty = document.getElementById('empty');
  var scroll = document.getElementById('scroll');
  var app = document.getElementById('app');
  var busy = false;

  var replies = [
    { k: /email|letter|message|write to/i, r: "Here's a draft you can adapt:\n\nSubject: Following up\n\nHi there,\n\nI hope you're well. I'm writing to follow up on the matter we discussed. Could you let me know a convenient time to sort this out? I'm happy to work around your schedule.\n\nThanks for your help,\n[Your name]\n\nWant me to make it more formal or shorter?" },
    { k: /plan|trip|weekend|travel|itinerary/i, r: "Here's a simple plan:\n\n• Day 1: Arrive mid-morning, take an easy walk to a lookout, and have a relaxed dinner nearby.\n• Day 2: Do a longer half-day hike early, then spend the afternoon at a café or market.\n• Day 3: Visit one local attraction before heading home in the early afternoon.\n\nShould I add accommodation ideas or a packing list?" },
    { k: /explain|how does|how do|what is|why/i, r: "Sure. In short, it comes down to a few main factors that are weighed together. The biggest one is usually your track record over time, followed by how much of your available limit you use, how long your history is, and how often you apply for new things.\n\nWould you like a worked example?" },
    { k: /recipe|cook|dinner|lunch|meal|food/i, r: "Try a quick garlic-ginger stir-fry:\n\n1. Slice a protein (chicken, tofu or prawns) and any vegetables you have.\n2. Sear the protein in a hot pan, then set it aside.\n3. Stir-fry the vegetables for 3–4 minutes with garlic and ginger.\n4. Add soy sauce, a little honey and a splash of water, then return the protein.\n\nServe with rice or noodles. It takes about 20 minutes." },
    { k: /./, r: "Thanks, I understand what you're after. Here's a starting point:\n\n1. Clarify the main goal and any constraints.\n2. List the options you have right now.\n3. Pick the one that best fits your time and budget, then take the first small step today.\n\nTell me a bit more and I can tailor this for you." }
  ];

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function grow() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 220) + 'px'; }
  function update() { grow(); send.disabled = busy || ta.value.trim() === ''; }
  function toBottom() { scroll.scrollTop = scroll.scrollHeight; }

  var icons = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10v11H3V10zM7 10l4-8a3 3 0 013 3v4h6a2 2 0 012 2.3l-1.4 8A2 2 0 0118.6 21H7"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 14V3h4v11zM17 14l-4 8a3 3 0 01-3-3v-4H4a2 2 0 01-2-2.3l1.4-8A2 2 0 015.4 3H17"/></svg>',
    redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg>'
  };

  function botMsg() {
    var m = el('div', 'msg bot');
    var av = el('div', 'avatar'); av.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>';
    var wrap = el('div', 'text');
    var dots = el('span', 'typing'); dots.innerHTML = '<i></i><i></i><i></i>';
    wrap.append(dots);
    m.append(av, wrap);
    thread.append(m);
    return wrap;
  }

  function stream(wrap, text) {
    var words = text.split(/(\s+)/), i = 0;
    wrap.textContent = '';
    var body = el('div'); wrap.append(body);
    var timer = setInterval(function () {
      body.textContent += words.slice(i, i + 3).join('');
      i += 3;
      toBottom();
      if (i >= words.length) {
        clearInterval(timer);
        var tools = el('div', 'bot-tools');
        [['copy', 'Copy'], ['up', 'Good response'], ['down', 'Bad response'], ['redo', 'Regenerate']].forEach(function (t) {
          var b = el('button'); b.type = 'button'; b.title = t[1]; b.setAttribute('aria-label', t[1]); b.innerHTML = icons[t[0]];
          if (t[0] === 'copy') b.addEventListener('click', function () { try { navigator.clipboard.writeText(text).catch(function () {}); } catch (e) {} });
          tools.append(b);
        });
        wrap.append(tools);
        busy = false; update(); ta.focus();
      }
    }, 40);
  }

  function submit(text) {
    if (busy || !text.trim()) return;
    empty.hidden = true;
    var u = el('div', 'msg user'); u.append(el('div', 'text', text));
    thread.append(u);
    document.dispatchEvent(new CustomEvent('lumen:sent', { detail: { text: text, at: new Date().toISOString() } }));
    ta.value = ''; busy = true; update();
    var wrap = botMsg(); toBottom();
    var reply = replies.find(function (x) { return x.k.test(text); }).r;
    setTimeout(function () { stream(wrap, reply); }, 900);
  }

  document.getElementById('composer').addEventListener('submit', function (e) { e.preventDefault(); submit(ta.value); });
  ta.addEventListener('input', update);
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(ta.value); }
  });
  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () { ta.value = c.dataset.p; update(); ta.focus(); });
  });
  document.getElementById('new-chat').addEventListener('click', function () {
    if (busy) return;
    Array.from(thread.querySelectorAll('.msg')).forEach(function (m) { m.remove(); });
    empty.hidden = false; ta.value = ''; update(); ta.focus(); app.classList.remove('open');
  });
  document.getElementById('menu-btn').addEventListener('click', function () { app.classList.add('open'); });
  document.getElementById('scrim').addEventListener('click', function () { app.classList.remove('open'); });
  update();
})();
</script>
</body>
</html>
